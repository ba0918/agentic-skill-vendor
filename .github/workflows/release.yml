name: Release

# A push to main is the one trigger. The human decision is the version bump
# commit — which version, and when — and everything after it is this workflow's:
# the tag and the publish. Narrowing the decision to one point is what keeps a
# half-finished release (a tag with nothing published, or the reverse) from
# being something a person has to remember to avoid.
on:
  push:
    branches: [main]

# One release at a time, and never cancelled. Two pushes landing close together
# would otherwise both read the same version before either had tagged it, and
# the later run would tag and publish from its own commit — so what reached npm
# would not be the tree the version bump named. Cancelling instead of queueing
# would trade that for a run stopped between the tag and the publish, which is
# the half-finished release this design exists to prevent.
concurrency:
  group: release
  cancel-in-progress: false

# Read by default. The two jobs that need more say so themselves, and neither
# holds a long-lived secret: the tag is pushed with the run's own token and the
# publish is authorized by this run's OIDC identity.
permissions:
  contents: read

jobs:
  # Most pushes to main are not releases. This job answers "is this one?" and
  # every other job hangs off its answer, so the question is asked once and in
  # one place.
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.state.outputs.version }}
      release: ${{ steps.state.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Decide whether this push releases a new version
        id: state
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          name="$(jq -r .name package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The tag is read from the remote rather than from a local clone, so
          # the answer does not depend on what this checkout happened to fetch.
          tagged=no
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            tagged=yes
          fi
          # A version that was never published makes `npm view` answer E404, and
          # that is an answer rather than a failure. Any other non-zero exit —
          # the registry unreachable, something in the way — is not an answer,
          # and reading it as "not published" would tag a version whose publish
          # then collides with the one already there. That leaves a tag with
          # nothing published: the half-finished release this workflow exists to
          # prevent, arrived at by the workflow itself.
          published=no
          if answer="$(npm view "$name@$version" version 2>&1)"; then
            published=yes
          else
            case "$answer" in
              *E404*) published=no ;;
              *)
                echo "::error::npm view could not answer whether $name@$version is published: $answer"
                exit 1
                ;;
            esac
          fi
          echo "version $version — tagged: $tagged, published: $published"

          if [ "$tagged" = yes ] && [ "$published" = yes ]; then
            echo "Already released; this push carries no version change."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Exactly one of the two is a half-finished release. npm refuses to
          # publish a version twice, so no re-run can resolve this: the way out
          # is a new version, which is a person's decision. Passing it silently
          # would hide the one state this design exists to prevent.
          if [ "$tagged" != "$published" ]; then
            echo "::error::v$version is half released (tagged: $tagged, published: $published). Release a new version rather than re-running this one."
            exit 1
          fi

          # The bump commit is meant to carry the version, the changelog heading
          # and the comparison link in one operation. The heading is the part of
          # that a machine can check, and checking it is what keeps the changelog
          # from being written after the fact.
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' heading. The bump commit has to promote the Unreleased section to $version."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  # The same checks every push and pull request runs, called rather than
  # restated. A tag is only ever created after this has passed.
  checks:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  tag:
    needs: [decide, checks]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    # The one job in this repository that writes to it, and it writes one ref.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The commit the checks ran against, named explicitly: the tag, the checks
      # and the published tarball all have to be the same tree, and a tag on
      # anything else would name a version nobody verified.
      - name: Tag the commit the checks passed on
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

  publish:
    needs: [decide, tag]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: npm authorizes this publish from the run's own OIDC
      # token, so no npm token is stored in this repository at all. This is the
      # only job that is given the identity.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The package's prepack builds dist/ with bun, so the publish needs bun on
      # the path as well as npm.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs a recent npm. Upgrading unconditionally keeps
      # this from depending on which npm the runner image happens to ship, and
      # on anyone remembering to raise a pinned floor.
      - name: Use a recent npm
        run: npm install -g npm@latest

      # prepare and prepack run from the package's own scripts during the
      # publish, and both need the development dependencies present.
      - name: Install the locked dependencies
        run: bun install --frozen-lockfile

      # The package name is scoped, and a scoped package is published restricted
      # unless the publish says otherwise.
      - name: Publish to npm
        run: npm publish --access public
