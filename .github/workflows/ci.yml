name: CI

# push is limited to main so a branch with an open PR runs once (via
# pull_request), not twice.
on:
  push:
    branches: [main]
  pull_request:
  # Called by the release workflow, so a release runs exactly the checks every
  # push and pull request runs. Called rather than restated there: two copies of
  # the check list could drift, and the release would then publish a tree the
  # other copy would have failed.
  workflow_call:

# Nothing in this workflow writes to the repository, so the token is held to
# read access instead of the repository default. In particular, CI never runs
# the tool's gen: CI only detects a tree that disagrees with its lock and fails.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      # The lockfile decides which versions a run resolves, and a lockfile that
      # would have to change for the install to succeed fails the run instead of
      # being rewritten.
      - name: Install the locked dependencies
        run: bun install --frozen-lockfile

      # `bun test` strips the types rather than checking them, so the check the
      # previous test runner did on the way past is its own step here.
      - name: Check the types
        run: bun run typecheck

      - name: Check the lint rules
        run: bun run lint

      # Formatting is checked rather than applied. A workflow that rewrote the
      # source would be a workflow whose output nobody reviewed.
      - name: Check the formatting
        run: bun run fmt:check

      # The same command PROJECT.md documents for local runs, so CI and the
      # documentation cannot drift apart.
      - name: Run the tool's own tests
        run: bun test

      # The tool is then run against the fixture tree, which is committed in a
      # state that verifies clean. A change to a contract, a copy or the lock
      # that was not regenerated makes this step fail. gen — the one operation
      # that changes the distributed state — is deliberately absent from here:
      # this workflow detects a disagreement and never resolves it.
      - name: Verify the fixture tree against its lock
        run: bun run src/cli.ts verify --root fixtures/contracts-basic/good

      - name: Check that the fixture skills are self-contained
        run: bun run src/cli.ts lint-selfcontain --root fixtures/contracts-basic/good

      # The second fixture takes one of its contracts from another repository,
      # and it is committed with the cache that contract's text sits in. Run
      # here, it states the boundary this workflow depends on: verify answers
      # from the tree alone, with no network, no credentials and no fetch.
      - name: Verify the fetched fixture tree against its lock
        run: bun run src/cli.ts verify --root fixtures/contracts-remote/good

      - name: Check that the fetched fixture skills are self-contained
        run: bun run src/cli.ts lint-selfcontain --root fixtures/contracts-remote/good
