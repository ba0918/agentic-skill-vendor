name: CI

# push is limited to main so a branch with an open PR runs once (via
# pull_request), not twice.
on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository, so the token is held to
# read access instead of the repository default. In particular, CI never runs
# the tool's accept operation: CI only detects unapproved drift and fails.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.x"

      # The same command PROJECT.md documents for local runs, so CI and the
      # documentation cannot drift apart.
      - name: Run the tool's own tests
        run: deno task test

      # The tool is then run against the fixture tree, which is committed in a
      # state that verifies clean. An unapproved change to a contract, a copy,
      # or the lock makes this step fail. Both commands are granted read access
      # only: neither of them writes, and accept — the one operation that
      # changes what is accepted — is deliberately absent from CI.
      - name: Verify the fixture tree against its lock
        run: >
          deno run --allow-read src/cli.ts verify
          --root fixtures/contracts-basic/good

      - name: Check that the fixture skills are self-contained
        run: >
          deno run --allow-read src/cli.ts lint-selfcontain
          --root fixtures/contracts-basic/good
