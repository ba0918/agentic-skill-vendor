name: CI

# push is limited to main so a branch with an open PR runs once (via
# pull_request), not twice.
on:
  push:
    branches: [main]
  pull_request:
  # Called by the release workflow, so a release runs exactly the checks every
  # push and pull request runs. Called rather than restated there: two copies of
  # the check list could drift, and the release would then publish a tree the
  # other copy would have failed.
  workflow_call:

# Nothing in this workflow writes to the repository, so the token is held to
# read access instead of the repository default. In particular, CI never runs
# the tool's gen: CI only detects a tree that disagrees with its lock and fails.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      # The lockfile decides which versions a run resolves, and a lockfile that
      # would have to change for the install to succeed fails the run instead of
      # being rewritten.
      - name: Install the locked dependencies
        run: bun install --frozen-lockfile

      # `bun test` strips the types rather than checking them, so the check the
      # previous test runner did on the way past is its own step here.
      - name: Check the types
        run: bun run typecheck

      - name: Check the lint rules
        run: bun run lint

      # Formatting is checked rather than applied. A workflow that rewrote the
      # source would be a workflow whose output nobody reviewed.
      - name: Check the formatting
        run: bun run fmt:check

      # The same command PROJECT.md documents for local runs, so CI and the
      # documentation cannot drift apart.
      - name: Run the tool's own tests
        run: bun test

      # The tool is then run against the fixture tree, which is committed in a
      # state that verifies clean. A change to a contract, a copy or the lock
      # that was not regenerated makes this step fail. gen — the one operation
      # that changes the distributed state — is deliberately absent from here:
      # this workflow detects a disagreement and never resolves it.
      - name: Verify the fixture tree against its lock
        run: bun run src/cli.ts verify --root fixtures/contracts-basic/good

      - name: Check that the fixture skills are self-contained
        run: bun run src/cli.ts lint-selfcontain --root fixtures/contracts-basic/good

      # The second fixture takes one of its contracts from another repository,
      # and it is committed with the cache that contract's text sits in. Run
      # here, it states the boundary this workflow depends on: verify answers
      # from the tree alone, with no network, no credentials and no fetch.
      - name: Verify the fetched fixture tree against its lock
        run: bun run src/cli.ts verify --root fixtures/contracts-remote/good

      - name: Check that the fetched fixture skills are self-contained
        run: bun run src/cli.ts lint-selfcontain --root fixtures/contracts-remote/good

      # The third fixture distributes raw bytes — a directory of scripts and
      # one file — into two skills at dests the table names. Verified here for
      # the same reason as the others, and its lock is the proof that the
      # placements a raw-byte contract adds leave a document-only lock
      # unchanged: the first two fixtures carry none.
      - name: Verify the raw-byte fixture tree against its lock
        run: bun run src/cli.ts verify --root fixtures/contracts-raw/good

      - name: Check that the raw-byte fixture skills are self-contained
        run: bun run src/cli.ts lint-selfcontain --root fixtures/contracts-raw/good

  package-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # prepack builds the published entry point with Bun. The tarball below is
      # therefore the same package shape npm would receive, not a source-tree
      # shortcut that can pass while dist/ is broken or missing.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.10"

      - name: Build and install the package tarball
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/package" "$RUNNER_TEMP/consumer"
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP/package" | tail -n 1)"
          npm install --prefix "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/package/$tarball"
          package_root="$RUNNER_TEMP/consumer/node_modules/@ba0918-dev/agentic-skill-vendor"
          package_bin="$RUNNER_TEMP/consumer/node_modules/.bin/agentic-skill-vendor"
          test -x "$package_bin"
          test -f "$package_root/dist/cli.js"
          echo "PACKAGE_ROOT=$package_root" >> "$GITHUB_ENV"
          echo "PACKAGE_BIN=$package_bin" >> "$GITHUB_ENV"

      - name: Smoke-test the installed bin on Node 20.10
        run: |
          set -euo pipefail
          node --version | grep -E '^v20\.10\.'
          "$PACKAGE_BIN" --help | grep -F 'usage: agentic-skill-vendor'
          "$PACKAGE_BIN" verify --root fixtures/contracts-raw/good
          "$PACKAGE_BIN" lint-selfcontain --root fixtures/contracts-basic/good
          refused="$(printf 'ghp_ has a space' | "$PACKAGE_BIN" fetch --token-stdin --root fixtures/contracts-basic/good 2>&1 || true)"
          echo "$refused" | grep -qF 'position 5'

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Smoke-test the installed bin on Node 24
        run: |
          set -euo pipefail
          node --version | grep -E '^v24\.'
          "$PACKAGE_BIN" --help | grep -F 'usage: agentic-skill-vendor'
          "$PACKAGE_BIN" verify --root fixtures/contracts-raw/good
          "$PACKAGE_BIN" lint-selfcontain --root fixtures/contracts-basic/good
          refused="$(printf 'ghp_ has a space' | "$PACKAGE_BIN" fetch --token-stdin --root fixtures/contracts-basic/good 2>&1 || true)"
          echo "$refused" | grep -qF 'position 5'

      - name: Smoke-test the installed package on Bun 1.3
        run: |
          set -euo pipefail
          bun --version | grep -E '^1\.3\.'
          bun "$PACKAGE_ROOT/dist/cli.js" --help | grep -F 'usage: agentic-skill-vendor'
          bun "$PACKAGE_ROOT/dist/cli.js" verify --root fixtures/contracts-raw/good
          bun "$PACKAGE_ROOT/dist/cli.js" lint-selfcontain --root fixtures/contracts-basic/good
          refused="$(printf 'ghp_ has a space' | bun "$PACKAGE_ROOT/dist/cli.js" fetch --token-stdin --root fixtures/contracts-basic/good 2>&1 || true)"
          echo "$refused" | grep -qF 'position 5'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: Smoke-test the installed package on Deno 2
        run: |
          set -euo pipefail
          deno --version | head -1 | grep -E '^deno 2\.'
          deno run --allow-read --allow-write "$PACKAGE_ROOT/dist/cli.js" --help | grep -F 'usage: agentic-skill-vendor'
          deno run --allow-read --allow-write "$PACKAGE_ROOT/dist/cli.js" verify --root fixtures/contracts-raw/good
          deno run --allow-read --allow-write "$PACKAGE_ROOT/dist/cli.js" lint-selfcontain --root fixtures/contracts-basic/good
          # Standard input is the one part of the token path that is a runtime
          # capability rather than this package's own code, and Deno is the
          # runtime whose answer cannot be assumed from the other two. A token
          # carrying a space is refused by position, and the position is only
          # knowable if the bytes actually arrived — an exit 0 would prove
          # nothing but that the run did not crash. The read needs no permission
          # of its own: the flags here are the same --allow-read --allow-write
          # the offline commands take.
          refused="$(printf 'ghp_ has a space' | deno run --allow-read --allow-write "$PACKAGE_ROOT/dist/cli.js" fetch --token-stdin --root fixtures/contracts-basic/good 2>&1 || true)"
          echo "$refused" | grep -qF 'position 5'
